name: Chore
description: Technical work with no change in product behaviour (tooling, CI, docs, refactoring).
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Title: `<Area>: <result>`, for example `CI: cache the Rust builds`. No type prefix: the label carries it.
        A chore is the only way to change the guards, the convention checks or the conventions workflow. Say so in the goal: it gets a closer review.
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checkable end state.
    validations:
      required: true
