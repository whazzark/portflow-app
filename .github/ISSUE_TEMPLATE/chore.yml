name: Chore
description: Technical work with no change in product behaviour (tooling, CI, docs, refactoring).
title: "[Chore] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: A chore that changes the guards, the convention checks or the conventions workflow is the only way to change them. Say so in the goal, it gets a closer review.
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checkable end state.
    validations:
      required: true
